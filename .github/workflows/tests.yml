name: Blockly generator tests

# The clover_blocks Python generators are pure functions from a block to a
# string: no browser, no ROS, no drone. So they can be tested in seconds here.
# Output is verified byte-identical to what the browser editor produces.

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  generator-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run golden-file tests
        run: npm test
